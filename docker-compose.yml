name: lumina-lead-platform

services:
  redis:
    image: redis:7-alpine
    container_name: lumina-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - lumina-network

  # Local SMTP catcher for EmailNotificationService — web UI at http://localhost:8025
  # to inspect outgoing emails without a real provider. Swap MAIL_HOST/MAIL_PORT
  # for SendGrid/SES in production and remove this service.
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: lumina-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - lumina-network

  backend:
    build:
      context: ./src/app
      dockerfile: Dockerfile
    container_name: lumina-backend
    depends_on:
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started
    environment:
      DB_URL: jdbc:postgresql://${DB_HOST}:${DB_PORT}/postgres?sslmode=require&prepareThreshold=0
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME}
      CRM_ACTIVE_PROVIDER: ${CRM_ACTIVE_PROVIDER}
      SALES_WEBHOOK_URL: ${SALES_WEBHOOK_URL}
      MEETING_PROVIDER: ${MEETING_PROVIDER:-jitsi}
      JITSI_BASE_URL: ${JITSI_BASE_URL:-https://meet.jit.si}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REFRESH_TOKEN: ${GOOGLE_REFRESH_TOKEN:-}
      GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID:-primary}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - lumina-network
  frontend:
    build:
      context: ./src/public
      dockerfile: Dockerfile
    container_name: lumina-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "4200:80"
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lumina-network

networks:
  lumina-network:
    driver: bridge
