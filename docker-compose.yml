name: lumina-lead-platform

services:
  redis:
    image: redis:7-alpine
    container_name: lumina-redis
    command: ["sh", "-c", "exec redis-server $${REDIS_PASSWORD:+--requirepass \"$$REDIS_PASSWORD\"}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli $${REDIS_PASSWORD:+-a \"$$REDIS_PASSWORD\" --no-auth-warning} ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - lumina-network

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: lumina-mailhog
    profiles: ["dev"]
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - lumina-network

  backend:
    build:
      context: ./src/app
    deploy:
      replicas: ${BACKEND_REPLICAS:-2}
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://${DB_HOST:?defina DB_HOST no .env}:${DB_PORT:?defina DB_PORT no .env}/postgres?sslmode=require&prepareThreshold=0
      DB_USER: ${DB_USER:?defina DB_USER no .env}
      DB_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      MAIL_HOST: ${MAIL_HOST:?defina MAIL_HOST no .env}
      MAIL_PORT: ${MAIL_PORT:?defina MAIL_PORT no .env}
      MAIL_USERNAME: ${MAIL_USERNAME:?defina MAIL_USERNAME no .env}
      MAIL_PASSWORD: ${MAIL_PASSWORD:?defina MAIL_PASSWORD no .env}
      MAIL_FROM: ${MAIL_FROM:?defina MAIL_FROM no .env}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
      MAIL_STARTTLS_REQUIRED: ${MAIL_STARTTLS_REQUIRED:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?defina CORS_ALLOWED_ORIGINS no .env}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      JWT_TTL_MINUTES: ${JWT_TTL_MINUTES:-120}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-false}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?defina ADMIN_EMAIL no .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?defina ADMIN_PASSWORD no .env}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador}
      CRM_ACTIVE_PROVIDER: ${CRM_ACTIVE_PROVIDER:?defina CRM_ACTIVE_PROVIDER no .env}
      SALES_WEBHOOK_URL: ${SALES_WEBHOOK_URL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?defina GOOGLE_CLIENT_ID no .env}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?defina GOOGLE_CLIENT_SECRET no .env}
      GOOGLE_REFRESH_TOKEN: ${GOOGLE_REFRESH_TOKEN:?defina GOOGLE_REFRESH_TOKEN no .env}
      GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID:-primary}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - lumina-network

  frontend:
    build:
      context: ./src/public
    container_name: lumina-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    networks:
      - lumina-network

networks:
  lumina-network:
    driver: bridge
