server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API: o navegador chama /api/... na mesma origem do frontend e o nginx repassa ao backend.
    # O resolver do Docker + variável fazem o nginx subir mesmo se o backend ainda não estiver de pé.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Arquivos com hash no nome (JS/CSS do build) podem ficar em cache por muito tempo
    location ~* \.(?:js|css|woff2?|svg|png|jpe?g|webp|ico)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html nunca em cache, para o usuário receber sempre a versão nova
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Fallback do Angular Router: /diagnostico, /relatorio, /sobre... sempre devolvem o index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}