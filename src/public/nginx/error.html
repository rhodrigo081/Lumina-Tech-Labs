<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Lumina Tech Labs — Página indisponível</title>
  <style>
    :root { --bg: #f7f9fb; --card: #ffffff; --fg: #0b1c30; --muted: #45464d; --accent: #131b2e; --on-accent: #ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0b1220; --card: #131b2e; --fg: #e6ebf5; --muted: #a9b0c0; --accent: #dae2fd; --on-accent: #131b2e; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
           background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { width: 100%; max-width: 440px; background: var(--card); border-radius: 16px; padding: 32px; box-shadow: 0 8px 24px rgba(0,0,0,.08); text-align: center; }
    img { width: 48px; height: 48px; }
    h1 { font-size: 22px; margin: 16px 0 8px; }
    p { margin: 0 0 24px; color: var(--muted); }
    a { display: inline-block; padding: 12px 20px; border-radius: 8px; background: var(--accent); color: var(--on-accent); text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <img src="/assets/logo-mark.png" alt="" />
    <h1>Não foi possível abrir esta página</h1>
    <p>O endereço pode estar incorreto ou o serviço está temporariamente indisponível. Tente novamente em instantes.</p>
    <a href="/diagnostico">Voltar ao início</a>
  </main>
</body>
</html>
