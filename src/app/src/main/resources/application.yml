server:
  port: ${PORT:8080}
  forward-headers-strategy: native
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false
    whitelabel:
      enabled: false
  tomcat:
    connection-timeout: 10s
    threads:
      max: 100
    accept-count: 100
    max-http-form-post-size: 64KB
    max-swallow-size: 64KB

spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  task:
    execution:
      pool:
        core-size: 4
        max-size: 16
        queue-capacity: 500
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    redis:
      # Upstash/Render: defina SPRING_DATA_REDIS_URL=rediss://default:<senha>@<host>:6379
      # (tem prioridade sobre host/port/password/ssl abaixo, usados no docker-compose local)
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}
      timeout: 2s
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: ${MAIL_STARTTLS_REQUIRED:true}
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

lumina:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

  security:
    jwt:
      secret: ${JWT_SECRET}
      ttl-minutes: ${JWT_TTL_MINUTES:120}

  admin:
    bootstrap:
      email: ${ADMIN_EMAIL}
      password: ${ADMIN_PASSWORD}
      name: ${ADMIN_NAME:Administrador}

  scheduling:
    zone: America/Sao_Paulo
    min-notice-minutes: 60
    booking-window-days: 60

  meeting:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      refresh-token: ${GOOGLE_REFRESH_TOKEN:}
      calendar-id: ${GOOGLE_CALENDAR_ID:primary}

  consent:
    term-version: v1.1

  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}

  idempotency:
    ttl-minutes: 15

  diagnostic:
    investment-per-workstation: 350
    co2-factor-per-real: 0.00042

  scoring:
    high-priority-workstations: 120
    high-priority-energy-bill: 15000

  crm:
    active-provider: ${CRM_ACTIVE_PROVIDER}

  notification:
    mail-from: ${MAIL_FROM}
    sales-webhook-url: ${SALES_WEBHOOK_URL:}

  contact:
    # Inbox that receives the public contact form (defaults to MAIL_FROM).
    recipient: ${CONTACT_EMAIL:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      # Container/platform health checks hit /actuator/health/readiness, which only covers what the
      # API needs to serve requests. SMTP stays out: a mail outage is handled per request (503 on the
      # contact form) and checking it would log into the mail server on every probe.
      group:
        readiness:
          include: readinessState,db,redis
        liveness:
          include: livenessState
  health:
    mail:
      enabled: false
  info:
    env:
      enabled: false

logging:
  pattern:
    correlation: "[req=%X{requestId:-}] "

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}
    path: /swagger-ui.html
