server:
  # Trust X-Forwarded-For/X-Forwarded-Proto only when they come from an internal proxy
  # (our nginx on the Docker network). request.getRemoteAddr() then returns the real
  # client IP and cannot be forged by the visitor (used in the LGPD consent log).
  forward-headers-strategy: native

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3 # Mantém o pool enxuto para serverless
      minimum-idle: 1
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate   # schema managed by Flyway, not Hibernate
    open-in-view: false     # avoid the OSIV anti-pattern with lazy relations (see LeadRepository @EntityGraph)
    properties:
      hibernate:
        jdbc:
          time_zone: UTC    # all timestamps are TIMESTAMPTZ / java.time.Instant (see V2 migration)
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}

lumina:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

  security:
    jwt:
      secret: ${JWT_SECRET}   # HS256 key for admin tokens — at least 32 characters
      ttl-minutes: 480

  # First admin user, created at startup only while the admin_user table is empty.
  admin:
    bootstrap:
      email: ${ADMIN_EMAIL:}
      password: ${ADMIN_PASSWORD:}
      name: ${ADMIN_NAME:Administrador}

  scheduling:
    zone: America/Sao_Paulo      # zone admins use when creating slots (dates/times typed in the admin area)
    min-notice-minutes: 60       # leads cannot book a slot starting sooner than this
    booking-window-days: 60      # how far ahead the public grid shows slots

  meeting:
    # jitsi  -> real Jitsi Meet room, no setup needed (default)
    # google -> Google Calendar event + Google Meet link; Google emails the invite to lead and technician
    provider: ${MEETING_PROVIDER:jitsi}
    jitsi:
      base-url: ${JITSI_BASE_URL:https://meet.jit.si}
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      refresh-token: ${GOOGLE_REFRESH_TOKEN:}
      calendar-id: ${GOOGLE_CALENDAR_ID:primary}

  idempotency:
    ttl-minutes: 15

  diagnostic:
    reduction-factor: 0.28
    investment-per-workstation: 350
    co2-factor-per-real: 0.00042

  scoring:
    high-priority-workstations: 120
    high-priority-energy-bill: 15000

  crm:
    active-provider: ${CRM_ACTIVE_PROVIDER}

  notification:
    mail-from: ${MAIL_FROM}
    sales-webhook-url: ${SALES_WEBHOOK_URL:}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
