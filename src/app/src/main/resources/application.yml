spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lumina}
    username: ${DB_USER:lumina}
    password: ${DB_PASSWORD:changeme}
  jpa:
    hibernate:
      ddl-auto: validate   # schema managed by Flyway, not Hibernate
    open-in-view: false     # avoid the OSIV anti-pattern with lazy relations (see LeadRepository @EntityGraph)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  mail:
    host: ${MAIL_HOST:smtp.sendgrid.net}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:apikey}
    password: ${MAIL_PASSWORD:changeme}

lumina:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

  security:
    jwt:
      secret: ${JWT_SECRET:CHANGE-THIS-SECRET-IN-PRODUCTION-MIN-32-CHARS}

  idempotency:
    ttl-minutes: 15

  diagnostic:
    reduction-factor: 0.28
    investment-per-workstation: 350
    co2-factor-per-real: 0.00042

  scoring:
    high-priority-workstations: 50
    high-priority-energy-bill: 15000

  crm:
    active-provider: ${CRM_ACTIVE_PROVIDER:HUBSPOT}

  notification:
    mail-from: ${MAIL_FROM:no-reply@luminatechlabs.com}
    sales-webhook-url: ${SALES_WEBHOOK_URL:https://hooks.slack.com/services/CHANGE-ME}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
